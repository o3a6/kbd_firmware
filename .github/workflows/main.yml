name: Build QMK Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install QMK and Dependencies
        run: |
          python3 -m pip install --user qmk
          # QMKの環境を初期化して必要なツール（インクルードファイル等）を強制同期
          qmk setup -y
          
      - name: Build Firmware
        run: |
          # リポジトリ内の正しいQMKディレクトリに移動
          cd qmk/qmk_firmware
          # 設定ファイル群をQMK本体の正しい位置にリンク（コピー）する
          cp -r ../../keyboards/crkbd/qmk/qmk_firmware/keyboards/crkbd/* ./keyboards/crkbd/
          # ビルドを実行
          qmk compile -kb crkbd/rev4_1/standard -km vial
          # 成果物を最上位レイヤーに退避
          cp ./.build/*.uf2 ../../

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: corne_v4_firmware
          path: ./*.uf2
